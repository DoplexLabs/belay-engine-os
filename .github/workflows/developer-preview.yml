name: developer-alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: Developer Alpha version label
        required: true
        default: 0.0.1-alpha.11
        type: string
      publish:
        description: Publish the verified archive as an unsigned prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  ALPHA_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Validate unsigned Apple Silicon alpha
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Require native Apple Silicon runner
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: Validate scripts
        run: |
          grep -F "readonly DEFAULT_VERSION=\"${ALPHA_VERSION}\"" scripts/install.sh
          bash -n scripts/build-developer-preview.sh
          bash -n scripts/smoke-developer-preview.sh
          bash -n scripts/alpha-readiness.sh
          bash -n scripts/validate-alpha-surface.sh
          scripts/validate-alpha-surface.sh

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build Apple Silicon alpha archive
        run: |
          scripts/build-developer-preview.sh \
            --arch arm64 \
            --version "${ALPHA_VERSION}" \
            --output-dir dist

      - name: Verify archive checksum
        run: |
          (
            cd dist
            shasum -a 256 -c \
              "belay-local-developer-alpha-v${ALPHA_VERSION}-darwin-arm64.tar.gz.sha256"
          )

      - name: Smoke-test Apple Silicon archive
        run: |
          scripts/smoke-developer-preview.sh \
            "dist/belay-local-developer-alpha-v${ALPHA_VERSION}-darwin-arm64.tar.gz"

      - name: Upload short-lived workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: belay-local-developer-alpha
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  windows-preview:
    # Unsigned Windows engineering preview. Published only by the publish job.
    name: Build and verify Windows preview
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build Windows preview archive
        run: |
          scripts/build-developer-preview.sh \
            --os windows \
            --arch amd64 \
            --version "${ALPHA_VERSION}" \
            --output-dir dist

      - name: Verify archive checksum
        run: |
          (
            cd dist
            sha256sum -c \
              "belay-local-developer-alpha-v${ALPHA_VERSION}-windows-amd64.zip.sha256"
          )

      - name: Windows archive smoke (pwsh)
        shell: pwsh
        run: |
          ./scripts/smoke-windows-preview.ps1 `
            -Archive "dist/belay-local-developer-alpha-$env:ALPHA_VERSION-windows-amd64.zip" `
            -ArchiveOnly

      - name: Windows installer contract (pwsh)
        shell: pwsh
        run: ./scripts/install_windows_test.ps1

      - name: Upload short-lived Windows preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: belay-local-windows-preview
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    # Publishing is the only job that sees both platforms' artifacts.
    name: Publish unsigned prerelease
    needs: [build, windows-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Download Apple Silicon archive
        uses: actions/download-artifact@v7
        with:
          name: belay-local-developer-alpha
          path: dist

      - name: Download Windows preview archive
        uses: actions/download-artifact@v7
        with:
          name: belay-local-windows-preview
          path: dist

      - name: Publish unsigned GitHub prerelease
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.BELAY_PUBLIC_RELEASE_TOKEN }}
        run: |
          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          Belay Local ${ALPHA_VERSION} for Apple Silicon macOS and Windows.

          This external alpha is unsigned and unnotarized. It is intended for
          informed testers who explicitly accept that limitation.

          The macOS build is Apple Silicon only. The Windows build is unsigned,
          so Windows SmartScreen will warn before it runs; use
          **More info -> Run anyway** only after checking the published
          SHA-256 sum. Do not disable SmartScreen.

          Install on macOS:

          \`\`\`bash
          curl -fsSL https://getbelay.vercel.app/install | bash
          \`\`\`

          Install on Windows, in PowerShell:

          \`\`\`powershell
          irm https://getbelay.vercel.app/install.ps1 -OutFile install.ps1
          .\install.ps1 -AllowUntrusted
          \`\`\`

          Belay keeps agent session content on-device and requires no account.
          Optional fixed-field usage telemetry and public release checks can
          be disabled independently.
          EOF
          gh release create "v${ALPHA_VERSION}" \
            --repo DoplexLabs/belay \
            --prerelease \
            --target main \
            --title "Belay Local ${ALPHA_VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "dist/belay-local-developer-alpha-v${ALPHA_VERSION}-darwin-arm64.tar.gz" \
            "dist/belay-local-developer-alpha-v${ALPHA_VERSION}-darwin-arm64.tar.gz.sha256" \
            "dist/belay-local-developer-alpha-v${ALPHA_VERSION}-windows-amd64.zip" \
            "dist/belay-local-developer-alpha-v${ALPHA_VERSION}-windows-amd64.zip.sha256" \
            "scripts/install.sh" \
            "scripts/install.ps1"
